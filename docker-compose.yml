services:
#Databases
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: ecommerce
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
      
#services
  auth:
    build: ./services/auth
    ports:
      - "8001:8001"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DB=ecommerce
      - JWT_SECRET=supersecretjwtkey123
    depends_on:
      mysql:
        condition: service_healthy
  products:
    build: ./services/products
    container_name: products-service
    ports:
      - "8002:8002"
    environment:
      - MONGO_HOST=mongodb
      - MONGO_USER=root
      - MONGO_PASSWORD=rootpassword
      - MONGO_DB=ecommerce
    depends_on:
      mongodb:
        condition: service_healthy
  
  orders:
    build: ./services/orders
    container_name: orders-services
    ports:
      - "8003:8003"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DB=ecommerce
      - JWT_SECRET=supersecretjwtkey123
    depends_on:
      mysql:
        condition: service_healthy 

        
  ai-chatbot:
    build: ./services/ai-chatbot
    container_name: ai-chatbot-service
    ports:
      - "8004:8004"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=openai/gpt-oss-120b

  ai-recommend:
    build: ./services/ai-recommend
    container_name: ai-recommend-service
    ports:
      - "8005:8005"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=openai/gpt-oss-120b
      - MONGO_HOST=mongodb
      - MONGO_USER=root
      - MONGO_PASSWORD=rootpassword
      - MONGO_DB=ecommerce
    depends_on:
      mongodb:
        condition: service_healthy

  ai-search:
    build: ./services/ai-search
    container_name: ai-search-service
    ports:
      - "8006:8006"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=openai/gpt-oss-120b
      - MONGO_HOST=mongodb
      - MONGO_USER=root
      - MONGO_PASSWORD=rootpassword
      - MONGO_DB=ecommerce
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./services/frontend
    container_name: frontend-service
    ports:
      - "3000:80"

  gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth
      - products
      - orders
      - ai-chatbot
      - ai-recommend
      - ai-search
      - frontend

volumes:
  mysql_data:
  mongo_data: 

