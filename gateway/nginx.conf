events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip compression for scale & fast loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream auth_service {
        server auth:8001;
        keepalive 32;
    }
    upstream products_service {
        server products:8002;
        keepalive 32;
    }
    upstream orders_service {
        server orders:8003;
        keepalive 32;
    }
    upstream chatbot_service {
        server ai-chatbot:8004;
        keepalive 16;
    }
    upstream recommend_service {
        server ai-recommend:8005;
        keepalive 16;
    }
    upstream search_service {
        server ai-search:8006;
        keepalive 16;
    }
    upstream frontend_service {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # ── Frontend (catch-all) ───────────────────────────────
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Auth Service ───────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Products Service ───────────────────────────────────
        location /api/products/ {
            proxy_pass http://products_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Orders Service ─────────────────────────────────────
        location /api/orders/ {
            proxy_pass http://orders_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── AI Chatbot ─────────────────────────────────────────
        location /api/chat/ {
            proxy_pass http://chatbot_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── AI Recommendations ─────────────────────────────────
        location /api/recommend/ {
            proxy_pass http://recommend_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── AI Search ──────────────────────────────────────────
        location /api/search/ {
            proxy_pass http://search_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}