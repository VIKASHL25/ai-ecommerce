# ── AI Chatbot ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-chatbot
  template:
    metadata:
      labels:
        app: ai-chatbot
    spec:
      containers:
      - name: ai-chatbot
        image: vikashl10/ecom-chatbot:latest
        ports:
        - containerPort: 8004
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: ecom-secret
              key: GROQ_API_KEY
        - name: GROQ_MODEL
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: GROQ_MODEL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecom-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
spec:
  selector:
    app: ai-chatbot
  ports:
  - port: 8004
    targetPort: 8004
---
