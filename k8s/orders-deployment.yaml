apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: vikashl10/ecom-orders:latest
        ports:
        - containerPort: 8003
        env:
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MYSQL_HOST
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MYSQL_USER
        - name: MYSQL_DB
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MYSQL_DB
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecom-secret
              key: MYSQL_PASSWORD
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_HOST
        - name: MONGO_USER
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_USER
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_DB
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecom-secret
              key: MONGO_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecom-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 40
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
spec:
  selector:
    app: orders
  ports:
  - port: 8003
    targetPort: 8003