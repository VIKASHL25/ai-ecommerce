apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
spec:
  replicas: 3
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
      - name: products
        image: vikashl10/ecom-products:latest
        ports:
        - containerPort: 8002
        env:
        - name: MONGO_HOST
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_HOST
        - name: MONGO_USER
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_USER
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: ecom-config
              key: MONGO_DB
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecom-secret
              key: MONGO_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecom-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 40
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 40
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
spec:
  selector:
    app: products
  ports:
  - port: 8002
    targetPort: 8002